<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyward Flight — Ring Run over Green Valley</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a26; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud-root { position: fixed; inset: 0; pointer-events: none; color: #eef6ff; }
  #hud { position: absolute; inset: 0; }
  .hud-row { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: nowrap; justify-content: center; width: max-content; max-width: 98vw; }
  .gauge { background: rgba(8, 20, 32, 0.72); border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; padding: 6px 10px 8px; min-width: 80px; text-align: center; backdrop-filter: blur(2px); }
  .gauge .label { display: block; font-size: 11px; letter-spacing: 2px; color: #a8c4dc; }
  .gauge .value { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .gauge .unit { font-size: 12px; color: #a8c4dc; margin-left: 3px; }
  .gauge .bar { height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; background: #35e0a1; }
  #hud-msg { position: absolute; top: 148px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #ffe9a8; text-shadow: 0 2px 8px rgba(0,0,0,0.7); white-space: nowrap; }
  #hud-warn { position: absolute; top: 184px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.7); white-space: nowrap; }
  #hud-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(238,246,255,0.85); background: rgba(8,20,32,0.55); padding: 5px 12px; border-radius: 8px; white-space: nowrap; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; background: rgba(6, 16, 26, 0.45); }
  #overlay.show { display: flex; }
  /* Title / end panels sit to the left so the aircraft and the runway stay
     visible in the middle of the frame (and in the screenshots). */
  #overlay.title, #overlay.over, #overlay.complete { justify-content: flex-start; padding-left: 56px; background: linear-gradient(90deg, rgba(6,16,26,0.55), rgba(6,16,26,0.15) 65%, rgba(6,16,26,0)); }
  #overlay.title .panel, #overlay.over .panel, #overlay.complete .panel { max-width: 480px; }
  .panel { max-width: 560px; margin: 16px; background: rgba(8, 22, 36, 0.88); border: 1px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 28px 32px; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
  .panel h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 3px; color: #ffc233; }
  .panel p { font-size: 16px; line-height: 1.5; color: #dbe9f5; }
  .panel .tag { font-size: 18px; color: #fff; font-weight: 600; }
  .panel .keys { font-size: 14px; color: #a8c4dc; }
  .panel .cta { font-size: 18px; font-weight: 700; color: #35e0a1; }
  .panel .best { font-size: 14px; color: #a8c4dc; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyward Flight: fly the propeller plane through the glowing rings and land on the runway"></canvas>
<div id="hud-root"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
